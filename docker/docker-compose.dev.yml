version: '3'
services:
  dev:
    image: unabridged-dev
    container_name: unabridged-dev
    volumes:
      - ../node_modules:/app/node_modules
      - ../:/app
      - ../library/db:/db
      - ../library/files:/library

    environment:
      ORIGIN: 'http://localhost:5173'
      TZ: 'America/New_York'

    stop_signal: SIGKILL
    working_dir: /app
    command: bash -c "pnpm i && pnpm exec prisma generate && pnpm run dev --host"
    init: true
    ports:
      - 5173:5173
    tty: true
    stdin_open: true

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    container_name: unabridged-dev-abs
    restart: unless-stopped
    environment:
      TZ: 'America/New_York'
    volumes:
      # Same files Unabridged writes to /library, seen by ABS as /audiobooks
      - ../library/files:/audiobooks
      - ../library/abs/config:/config
      - ../library/abs/metadata:/metadata
    ports:
      - 13378:80
